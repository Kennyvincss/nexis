    <div style="padding:6px">${[['#/profile', 'user', 'Profile'], ['#/settings?tab=account', 'sliders', 'Account settings'], ['#/settings?tab=profile', 'edit', 'Profile settings'], ['#/settings?tab=wallets', 'wallet', 'Wallets'], ['#/settings?tab=security', 'shield', 'Security']].map(([h, i, l]) => `<a class="nav-item" href="${h}" data-action="closeUserMenu">${ic(i)}<span>${l}</span></a>`).join('')}
    <div class="nav-sep" style="margin:6px"></div><button class="nav-item" style="width:100%" data-action="logout">${ic('logout')}<span>Log out</span></button></div></div>`;

  renderSteps(0);

  const r = await aiP;

function createMarketFlow() {

      setTimeout(async () => {

}

function startCopy(h) {
  const ex = Store.copyOf(h);
  const a = +$('#cp-alloc').value, mx = +$('#cp-max').value, d = +$('#cp-day').value;
  const cats = $$('[data-cpcat]:checked').map(x => x.dataset.cpcat);
  const sps = cats.includes('Sports') ? $$('[data-cpsport]:checked').map(x => x.dataset.cpsport) : [];
  const tys = cats.includes('Sports') ? $$('[data-cptype]:checked').map(x => x.dataset.cptype) : [];
  const sportsCfg = { sports: sps.length === SPORTS.length ? [] : sps, types: tys.length === 2 ? [] : tys };
  if (cats.includes('Sports') && (!sps.length || !tys.length)) return toast({ title: 'Check your sports filter', body: 'Pick at least one sport and one market type.', kind: 'warn' });
  const err = !cats.length ? 'Choose at least one market category.' : !(a > 0) ? 'Enter an allocation.' : !(mx > 0) ? 'Enter a maximum per trade.' : mx > a ? 'Maximum per trade can’t exceed the allocation.' : !(d >= mx) ? 'Daily allocation must be at least the per-trade maximum.' : null;
  if (err) return toast({ title: 'Check your copy settings', body: err, kind: 'warn' });
  if (ex) { Object.assign(ex, { maxPer: mx, dailyMax: d, cats, ...sportsCfg, auto: $('#cp-auto').checked, stopLoss: $('#cp-stop').checked }); ex.log.unshift({ t: now(), ok: true, text: 'Updated copy rules' }); Store.emit('copy'); closeModal(); toast({ title: `Updated copy rules for @${hName(h)}` }); refresh(); return; }
  try { CopyEngine.start(h, { allocation: a, maxPer: mx, dailyMax: d, cats, ...sportsCfg, auto: $('#cp-auto').checked, stopLoss: $('#cp-stop').checked }); }
  catch (e) { return toast({ title: 'Couldn’t start copying', body: esc(e.message), kind: 'err' }); }
  if (!Store.isFollowing(h)) Store.s.following.push(h);
  markDemo('copy'); if (cats.includes('Sports')) markDemo('s-copy');
  Store.emit('copy');
  setModal(`${modalHead(`Copying @${esc(hName(h))}`)}<div class="modal-body"><div class="receipt"><div class="okc">${ic('check', 'lg')}</div><h3 style="font-size:18px">You’re now copying @${esc(hName(h))}</h3><p class="dim" style="margin-top:4px">${usd(a)} allocated · ${usd(mx)} max per trade · ${cats.join(', ')}${sportsCfg.sports.length ? ' (' + sportsCfg.sports.join(', ') + ')' : ''}</p></div>${simNote('Simulated. New eligible trades from this trader will be mirrored into your demo portfolio.')}</div><div class="modal-foot"><button class="btn btn-ghost" data-action="closeModal">Close</button><a class="btn btn-primary" href="#/copy" data-action="closeModal">View copy dashboard</a></div>`);
  refresh();
  if (isPm(h)) return; // live traders: copies fire when their next real trade arrives
  // Simulate the trader's next move so the copy engine has something to mirror
  const liveOr = (id, alt) => { const m = Store.market(id); return m && !m.resolved ? id : alt; };
  const next = h === 'FootballMind' ? [liveOr('ars-che-o25', liveOr('ars-che-btts', 'rma-bar-o25')), 'YES', 60] : h === 'CourtVision' ? [liveOr('nyl-lva-p-wilson-pts', 'lal-gsw-p-lebron-pts'), 'YES', 50] : h === 'CryptoAlex' ? ['btc-150k', 'YES', 150] : h === 'SarahTrades' ? ['fed-oct', 'YES', 120] : h === 'MarketMind' ? ['btc-150k', 'YES', 90] : h === 'SolTrader' ? ['sol-300', 'YES', 80] : ['arsenal-next', 'YES', 60];
  setTimeout(async () => {
    const { copied } = await simulateTraderTrade(h, ...next);
    const m = Store.market(next[0]);
    const mine = copied.find(c => !c.skipped);
    if (mine && Store.market(next[0]).eventId) markDemo('s-copied');
    if (mine) toast({ title: `Copied @${hName(h)}: ${next[1]} · ${usd(mine.amt)}`, body: `${esc(m.q)} at ${cents(mine.price)} · simulated`, kind: 'info', ms: 9000, action: { label: 'View portfolio', href: '#/portfolio' } });
    else if (copied[0]) toast({ title: `Skipped a trade from @${hName(h)}`, body: esc(copied[0].skipped), kind: 'warn' });
    refresh();
  }, 3200);
}

/* settle a live market that resolved: pays positions and copies at $1 / $0 */
function settleMarket(m, outcome, src) {
  if (m.resolved) return; Store.bumpMarket(m.id, { resolved: outcome, yes: outcome === 'YES' ? 1 : 0 }); m.resolved = outcome; m.yes = outcome === 'YES' ? 1 : 0;
  const S = Store.s; let n = 0;
  S.positions = S.positions.filter(p => { if (p.m !== m.id) return true; const pay = p.side === outcome ? p.shares : 0; S.wallet.available = +(S.wallet.available + pay).toFixed(2); n++;
    S.settled.unshift({ m: m.id, q: m.q, side: p.side, shares: p.shares, entry: p.entry, payout: pay, pnl: pay - p.shares * p.entry, outcome, t: now() });
    Tx.settle(Tx.start('Payout', `${p.side} · ${m.q}`, pay, m.id), 'SETTLE-' + (++S.orderSeq));
    Store.notify({ kind: pay ? 'won' : 'lost', icon: pay ? 'trophy' : 'x', text: `<b>${esc(m.q)}</b> resolved ${outcome} on ${src}. Your position ${pay ? '<span class="up">won</span>' : '<span class="down">lost</span>'} (${sUsd(pay - p.shares * p.entry)}, paper)`, href: '#/portfolio' }); return false; });
  S.copies.forEach(c => { c.positions = c.positions.filter(p => { if (p.m !== m.id) return true; const pay = p.side === outcome ? p.shares : 0; c.cash = +(c.cash + pay).toFixed(4); c.log.unshift({ t: now(), ok: true, text: `Resolved ${outcome}: “${m.q}” — ${pay ? 'won ' + usd(pay) : 'lost ' + usd(p.shares * p.entry)}` }); return false; }); });
  if (n) toast({ title: `Market resolved ${outcome}`, body: esc(m.q), kind: 'info', action: { label: 'Portfolio', href: '#/portfolio' } });
  Store.cacheExt(m); Store.emit('resolve'); RT.touch(m);
}

    PM.loadEvents(); setInterval(() => !document.hidden && PM.loadEvents(), 20000);
    PM.pollTrades(); setInterval(() => !document.hidden && PM.pollTrades(), 8000);
    setTimeout(() => PM.refreshHeld(), 4000); setInterval(() => PM.refreshHeld(), 60000);
    Spot.connect(); Sports.poll();
    setTimeout(() => Tracker.poll(), 3000); setInterval(() => !document.hidden && Tracker.poll(), 20000);
    NexisSim.start(); WalletLive.attach();
    setInterval(() => softRefresh(), 1000);
    setInterval(() => { if (!document.hidden) { $$('[data-evclock]').forEach(el => { const ev = EV(el.dataset.evclock); if (ev && !ev.real) return; if (ev) el.textContent = Live.clockLabel(ev); }); } }, 15000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { PM.loadEvents(); PM.pollTrades(); Sports.poll(); } });
  },
};

})();
