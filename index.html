<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXIS — See the signal. Make the move.</title>
<meta name="description" content="Nexis turns predictions from social media and the real world into markets you can trade, discuss, follow and copy. Powered by Panta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060A; --bg-2:#080A10; --card:#0C0F16; --card-2:#11151F; --card-3:#161B27;
  --line:#1A1F2B; --line-2:#252B3A; --line-3:#323A4D;
  --text:#F2F4F8; --text-2:#A7AEBD; --muted:#6C7488;
  --blue:#3D7BFF; --blue-2:#2C63E6; --blue-soft:rgba(61,123,255,.12); --blue-line:rgba(61,123,255,.35);
  --purple:#8E6BFF; --purple-soft:rgba(142,107,255,.12);
  --green:#1FCB7C; --green-soft:rgba(31,203,124,.12); --green-line:rgba(31,203,124,.35);
  --red:#F2475C; --red-soft:rgba(242,71,92,.12); --red-line:rgba(242,71,92,.35);
  --amber:#F2B544; --amber-soft:rgba(242,181,68,.12);
  --r-lg:14px; --r:10px; --r-sm:7px; --r-xs:5px;
  --font:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --top:56px; --side:236px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Nexis is a dark-only product; tokens restated per theme hook so the viewer's setting never flips it. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#05060A; --text:#F2F4F8; } }
:root[data-theme="dark"]{ --bg:#05060A; --text:#F2F4F8; }
:root[data-theme="light"]{ --bg:#05060A; --text:#F2F4F8; }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px); }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; background:var(--bg); color:var(--text); }
body{ font-family:var(--font); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; font-feature-settings:"ss01","cv11"; overflow-x:hidden; }
a{ color:inherit; text-decoration:none; }
button,input,textarea,select{ font:inherit; color:inherit; }
button{ cursor:pointer; background:none; border:0; padding:0; }
img,svg{ max-width:100%; display:block; }
h1,h2,h3,h4{ margin:0; font-weight:600; letter-spacing:-.01em; }
p{ margin:0; }
.num{ font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.up{ color:var(--green); } .down{ color:var(--red); } .dim{ color:var(--text-2); } .mut{ color:var(--muted); }
.blue{ color:var(--blue); } .purple{ color:var(--purple); }
:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; border-radius:6px; }
::selection{ background:rgba(61,123,255,.35); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.ic{ width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
.ic.sm{ width:14px; height:14px; } .ic.lg{ width:22px; height:22px; }

/* ---------- Buttons ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:38px; padding:0 16px; border-radius:var(--r-sm); font-weight:550; font-size:14px; white-space:nowrap; border:1px solid transparent; transition:background .15s, border-color .15s, color .15s, transform .08s; user-select:none; }
.btn:active{ transform:translateY(1px); }
.btn.sm{ height:30px; padding:0 11px; font-size:13px; }
.btn.lg{ height:46px; padding:0 22px; font-size:15px; }
.btn.block{ width:100%; }
.btn-primary{ background:var(--text); color:#05060A; }
.btn-primary:hover{ background:#fff; }
.btn-blue{ background:var(--blue); color:#fff; }
.btn-blue:hover{ background:#5089FF; }
.btn-ghost{ background:var(--card-2); border-color:var(--line-2); color:var(--text); }
.btn-ghost:hover{ background:var(--card-3); border-color:var(--line-3); }
.btn-quiet{ color:var(--text-2); }
.btn-quiet:hover{ color:var(--text); background:var(--card-2); }
.btn-yes{ background:var(--green-soft); color:var(--green); border-color:var(--green-line); }
.btn-yes:hover,.btn-yes.on{ background:var(--green); color:#03140B; }
.btn-no{ background:var(--red-soft); color:var(--red); border-color:var(--red-line); }
.btn-no:hover,.btn-no.on{ background:var(--red); color:#1A0306; }
.btn[disabled]{ opacity:.45; pointer-events:none; }
.iconbtn{ width:36px; height:36px; display:inline-grid; place-items:center; border-radius:var(--r-sm); color:var(--text-2); position:relative; }
.iconbtn:hover{ background:var(--card-2); color:var(--text); }
#bell-badge{ position:absolute; inset:0; pointer-events:none; }
.dot-badge{ position:absolute; top:6px; right:6px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--blue); color:#fff; font-size:10px; font-weight:600; display:grid; place-items:center; border:2px solid var(--bg); }

/* ---------- Chips / tags ---------- */
.chip{ display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 13px; border-radius:999px; border:1px solid var(--line-2); color:var(--text-2); font-size:13px; font-weight:500; background:transparent; transition:all .15s; }
.chip:hover{ color:var(--text); border-color:var(--line-3); }
.chip.on{ background:var(--text); color:#05060A; border-color:var(--text); }
.tag{ display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:var(--r-xs); background:var(--card-3); color:var(--text-2); font-size:12px; font-weight:500; white-space:nowrap; }
.tag.blue{ background:var(--blue-soft); color:#8FB2FF; }
.tag.purple{ background:var(--purple-soft); color:#B8A4FF; }
.tag.green{ background:var(--green-soft); color:var(--green); }
.tag.red{ background:var(--red-soft); color:var(--red); }
.tag.amber{ background:var(--amber-soft); color:var(--amber); }
.tag.demo{ background:transparent; border:1px dashed var(--line-3); color:var(--muted); height:20px; font-size:11px; }
.chg{ font-family:var(--mono); font-size:12px; font-weight:500; display:inline-flex; align-items:center; gap:2px; }

/* ---------- Topbar ---------- */
.topbar{ position:sticky; top:0; z-index:40; height:var(--top); padding-top:env(safe-area-inset-top,0px); box-sizing:content-box; background:rgba(5,6,10,.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; padding-left:18px; padding-right:16px; }
.logo{ display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.14em; font-size:15px; width:calc(var(--side) - 18px); flex:none; }
.logo svg{ width:24px; height:24px; }
.search-trigger{ flex:1; max-width:520px; height:38px; display:flex; align-items:center; gap:10px; padding:0 12px; border-radius:var(--r-sm); background:var(--card); border:1px solid var(--line); color:var(--muted); text-align:left; }
.search-trigger:hover{ border-color:var(--line-2); color:var(--text-2); }
.kbd{ margin-left:auto; font-family:var(--mono); font-size:11px; border:1px solid var(--line-2); border-radius:4px; padding:1px 5px; color:var(--muted); }
.top-actions{ margin-left:auto; display:flex; align-items:center; gap:6px; }
.wallet-pill{ display:flex; align-items:center; gap:8px; height:36px; padding:0 12px 0 10px; border-radius:var(--r-sm); background:var(--card-2); border:1px solid var(--line-2); }
.wallet-pill .bal{ font-family:var(--mono); font-weight:500; }
.wallet-pill .live{ width:7px; height:7px; border-radius:50%; background:var(--green); }
.avatar{ width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-weight:600; font-size:12px; color:#fff; flex:none; letter-spacing:0; }
.avatar.lg{ width:64px; height:64px; font-size:22px; }
.avatar.md{ width:40px; height:40px; font-size:14px; }
.avatar.sm{ width:24px; height:24px; font-size:10px; }

/* ---------- Shell ---------- */
.shell{ display:grid; grid-template-columns:var(--side) minmax(0,1fr); min-height:calc(100vh - var(--top)); }
.sidebar{ position:sticky; top:calc(var(--top) + env(safe-area-inset-top,0px)); height:calc(100vh - var(--top) - env(safe-area-inset-top,0px)); border-right:1px solid var(--line); padding:14px 12px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; }
.nav-item{ display:flex; align-items:center; gap:12px; height:38px; padding:0 12px; border-radius:var(--r-sm); color:var(--text-2); font-weight:500; transition:background .12s,color .12s; }
.nav-item:hover{ background:var(--card); color:var(--text); }
.nav-item.on{ background:var(--card-2); color:var(--text); box-shadow:inset 2px 0 0 var(--blue); }
.nav-item .count{ margin-left:auto; font-size:11px; font-family:var(--mono); color:var(--muted); }
.nav-item .count.hot{ color:#fff; background:var(--blue); border-radius:9px; padding:0 6px; }
.nav-sep{ height:1px; background:var(--line); margin:10px 6px; }
.nav-bottom{ margin-top:auto; display:flex; flex-direction:column; gap:2px; }
.panta-badge{ margin:10px 4px 2px; padding:12px; border:1px solid var(--line); border-radius:var(--r); display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--muted); }
.panta-badge b{ color:var(--text); font-weight:600; display:flex; align-items:center; gap:7px; font-size:13px; }
.status-dot{ width:7px; height:7px; border-radius:50%; background:var(--amber); display:inline-block; }
.main{ min-width:0; padding:28px 32px 80px; }
.page{ max-width:1320px; margin:0 auto; }
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:22px; flex-wrap:wrap; }
.page-head h1{ font-size:28px; letter-spacing:-.025em; }
.page-head p{ color:var(--text-2); margin-top:6px; max-width:62ch; }
.bottomnav{ display:none; }

/* ---------- Cards ---------- */
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); }
.card-pad{ padding:18px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); }
.card-head h3{ font-size:14px; font-weight:600; display:flex; align-items:center; gap:8px; }
.section{ margin-top:36px; }
.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:12px; }
.section-head h2{ font-size:18px; letter-spacing:-.015em; display:flex; align-items:center; gap:10px; }
.link{ color:var(--text-2); font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:4px; }
.link:hover{ color:var(--text); }
.grid{ display:grid; gap:14px; }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)); } .g3{ grid-template-columns:repeat(3,minmax(0,1fr)); } .g4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.gauto{ grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); }
.row{ display:flex; align-items:center; gap:10px; }
.row.wrap{ flex-wrap:wrap; }
.stack{ display:flex; flex-direction:column; gap:10px; }
.spacer{ flex:1; }
.divider{ height:1px; background:var(--line); }

/* stats */
.stat{ padding:16px 18px; }
.stat .k{ font-size:12px; color:var(--muted); font-weight:500; display:flex; align-items:center; gap:6px; }
.stat .v{ font-family:var(--mono); font-size:22px; font-weight:500; margin-top:6px; letter-spacing:-.02em; }
.stat .s{ font-size:12px; margin-top:2px; }
.stats-strip{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); border:1px solid var(--line); border-radius:var(--r-lg); background:var(--card); }
.stats-strip .stat + .stat{ border-left:1px solid var(--line); }

/* ---------- Market card ---------- */
.mcard{ position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; display:flex; flex-direction:column; gap:12px; transition:border-color .15s, background .15s; }
.mcard:hover{ border-color:var(--line-3); background:#0E121A; }
.mcard-top{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
.mcard-top .time{ margin-left:auto; display:flex; align-items:center; gap:5px; font-family:var(--mono); }
.mcard h3{ font-size:15px; font-weight:550; line-height:1.35; min-height:2.7em; letter-spacing:-.01em; }
.mcard h3 a::after{ content:""; position:absolute; inset:0; border-radius:inherit; }
.mcard-mid{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
.prob-big{ font-family:var(--mono); font-size:28px; font-weight:500; letter-spacing:-.03em; line-height:1; }
.prob-lbl{ font-size:12px; color:var(--muted); margin-top:6px; display:flex; gap:8px; align-items:center; }
.yn{ display:grid; grid-template-columns:1fr 1fr; gap:8px; position:relative; z-index:2; }
.yn .btn{ height:36px; font-family:var(--mono); font-size:13px; justify-content:space-between; padding:0 12px; }
.yn .btn span:first-child{ font-family:var(--font); font-weight:600; }
.mcard-foot{ display:flex; gap:14px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); padding-top:11px; }
.mcard-foot b{ color:var(--text-2); font-weight:500; font-family:var(--mono); }
.mcard .origin{ font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; position:relative; z-index:2; }
.spark{ width:120px; height:40px; }
.probbar{ height:4px; border-radius:2px; background:var(--red-soft); overflow:hidden; display:flex; }
.probbar i{ background:var(--green); display:block; height:100%; }

/* ---------- Tables ---------- */
.table-wrap{ overflow-x:auto; }
table.t{ width:100%; border-collapse:collapse; font-size:13px; }
.t th{ text-align:left; font-weight:500; color:var(--muted); font-size:12px; padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
.t th.r,.t td.r{ text-align:right; }
.t td{ padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
.t tr:last-child td{ border-bottom:0; }
.t tbody tr{ transition:background .12s; }
.t tbody tr.click:hover{ background:var(--card-2); cursor:pointer; }
.t .q{ white-space:normal; min-width:240px; font-weight:500; color:var(--text); }
.t th button{ color:inherit; display:inline-flex; align-items:center; gap:4px; }
.t th button.on{ color:var(--text); }

/* ---------- Tabs ---------- */
.tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tab{ height:40px; padding:0 14px; color:var(--text-2); font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
.tab:hover{ color:var(--text); }
.tab.on{ color:var(--text); border-bottom-color:var(--text); }
.seg{ display:inline-flex; padding:3px; background:var(--card); border:1px solid var(--line); border-radius:var(--r-sm); gap:2px; }
.seg button{ height:28px; padding:0 11px; border-radius:5px; font-size:12px; font-weight:550; color:var(--text-2); font-family:var(--mono); }
.seg button.on{ background:var(--card-3); color:var(--text); }
.seg.text button{ font-family:var(--font); font-size:13px; }

/* ---------- Forms ---------- */
.field{ display:flex; flex-direction:column; gap:7px; }
.field > span, .label{ font-size:12px; color:var(--text-2); font-weight:500; }
.input, .textarea, .select{ width:100%; background:var(--bg-2); border:1px solid var(--line-2); border-radius:var(--r-sm); padding:10px 12px; color:var(--text); outline:none; transition:border-color .15s, background .15s; }
.input:focus,.textarea:focus,.select:focus{ border-color:var(--blue); background:#0A0D15; }
.textarea{ resize:vertical; min-height:90px; line-height:1.5; }
.input-affix{ position:relative; }
.input-affix .input{ padding-left:28px; font-family:var(--mono); font-size:16px; }
.input-affix::before{ content:"$"; position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-family:var(--mono); }
.check{ display:flex; align-items:flex-start; gap:10px; cursor:pointer; padding:6px 0; }
.check input{ appearance:none; width:18px; height:18px; border-radius:5px; border:1.5px solid var(--line-3); background:var(--bg-2); flex:none; margin:1px 0 0; display:grid; place-items:center; transition:all .12s; }
.check input:checked{ background:var(--blue); border-color:var(--blue); }
.check input:checked::after{ content:""; width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(-45deg) translate(1px,-1px); }
.toggle{ appearance:none; width:36px; height:20px; border-radius:10px; background:var(--line-3); position:relative; cursor:pointer; transition:background .15s; flex:none; }
.toggle::after{ content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .15s; }
.toggle:checked{ background:var(--blue); }
.toggle:checked::after{ transform:translateX(16px); }
.presets{ display:flex; gap:6px; flex-wrap:wrap; }
.presets button{ height:28px; padding:0 10px; border-radius:6px; background:var(--card-2); border:1px solid var(--line-2); font-family:var(--mono); font-size:12px; color:var(--text-2); }
.presets button:hover{ color:var(--text); border-color:var(--line-3); }

/* ---------- Market page ---------- */
.mkt-layout{ display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:20px; align-items:start; }
.mkt-head{ display:flex; gap:16px; align-items:flex-start; }
.mkt-icon{ width:52px; height:52px; border-radius:12px; display:grid; place-items:center; flex:none; background:var(--card-2); border:1px solid var(--line-2); font-family:var(--mono); font-weight:600; font-size:13px; }
.mkt-head h1{ font-size:26px; line-height:1.2; letter-spacing:-.025em; max-width:26ch; }
.mkt-meta{ display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:10px; color:var(--muted); font-size:13px; align-items:center; }
.mkt-meta span{ display:inline-flex; align-items:center; gap:6px; }
.price-row{ display:flex; align-items:flex-end; gap:28px; margin:22px 0 4px; flex-wrap:wrap; }
.price-row .big{ font-family:var(--mono); font-size:44px; font-weight:500; letter-spacing:-.04em; line-height:1; }
.price-row .lbl{ font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:500; }
.chart-box{ position:relative; height:320px; margin-top:8px; }
.chart-box.sm{ height:200px; }
.chart-box svg{ width:100%; height:100%; overflow:visible; }
.chart-tip{ position:absolute; pointer-events:none; background:var(--card-3); border:1px solid var(--line-3); border-radius:6px; padding:6px 9px; font-size:12px; white-space:nowrap; transform:translate(-50%,-100%); margin-top:-12px; opacity:0; transition:opacity .1s; }
.chart-tip b{ font-family:var(--mono); font-weight:500; display:block; font-size:13px; }
.chart-tip span{ color:var(--muted); font-size:11px; }
.trade-panel{ position:sticky; top:calc(var(--top) + 20px); }
.trade-panel .side-toggle{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.trade-panel .side-toggle .btn{ height:52px; flex-direction:column; gap:0; font-size:13px; }
.trade-panel .side-toggle .btn b{ font-family:var(--mono); font-size:17px; font-weight:500; }
.est{ display:flex; flex-direction:column; gap:9px; font-size:13px; padding:14px; border-radius:var(--r); background:var(--bg-2); border:1px solid var(--line); }
.est div{ display:flex; justify-content:space-between; gap:10px; }
.est div span:first-child{ color:var(--muted); }
.est div span:last-child{ font-family:var(--mono); }
.est .hl span:last-child{ color:var(--green); font-weight:500; }
.info-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); }
.info-grid > div{ padding:14px 18px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
.info-grid > div:nth-child(4n){ border-right:0; }
.info-grid > div:nth-last-child(-n+4){ border-bottom:0; }
.info-grid .k{ font-size:12px; color:var(--muted); }
.info-grid .v{ font-family:var(--mono); margin-top:4px; font-size:14px; }
.rules{ padding:16px 18px; border-top:1px solid var(--line); display:grid; grid-template-columns:1fr 1fr; gap:18px; font-size:13px; color:var(--text-2); }
.rules h4{ font-size:12px; color:var(--muted); font-weight:500; margin-bottom:5px; }

/* AI panel */
.ai-panel{ border:1px solid var(--line-2); border-radius:var(--r-lg); background:linear-gradient(180deg, rgba(142,107,255,.06), rgba(61,123,255,0) 140px), var(--card); overflow:hidden; }
.ai-head{ display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line); }
.ai-head h3{ font-size:12px; letter-spacing:.12em; font-weight:600; }
.ai-mark{ width:26px; height:26px; border-radius:7px; display:grid; place-items:center; background:var(--purple-soft); color:#B8A4FF; }
.ai-cols{ display:grid; grid-template-columns:1fr 1fr; }
.ai-col{ padding:16px 18px; }
.ai-col + .ai-col{ border-left:1px solid var(--line); }
.ai-col h4{ font-size:13px; display:flex; align-items:center; gap:8px; margin-bottom:12px; font-weight:600; }
.ai-col h4 i{ width:8px; height:8px; border-radius:2px; display:block; }
.factor{ padding:10px 0; border-top:1px solid var(--line); }
.factor:first-of-type{ border-top:0; padding-top:0; }
.factor b{ font-size:13px; font-weight:550; display:block; }
.factor p{ font-size:13px; color:var(--text-2); margin-top:3px; }
.ai-foot{ padding:12px 18px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.sentiment{ display:flex; height:8px; border-radius:4px; overflow:hidden; gap:2px; }
.sentiment i{ display:block; height:100%; }

/* Posts / comments */
.post{ padding:16px 18px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:40px minmax(0,1fr); gap:12px; }
.post:last-child{ border-bottom:0; }
.post-head{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:13px; }
.post-head b{ font-weight:600; }
.post-head .t{ color:var(--muted); }
.post-body{ margin-top:4px; font-size:14.5px; line-height:1.5; }
.post-actions{ display:flex; gap:4px; margin-top:10px; margin-left:-8px; flex-wrap:wrap; }
.post-actions button{ height:30px; padding:0 9px; border-radius:6px; display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:12.5px; font-weight:500; }
.post-actions button:hover{ background:var(--card-2); color:var(--text); }
.post-actions button.liked{ color:var(--red); }
.post-actions button.copyx{ color:#8FB2FF; }
.post-actions button.copyx:hover{ background:var(--blue-soft); }
.trade-chip{ display:inline-flex; align-items:center; gap:8px; margin-top:10px; padding:8px 11px; border-radius:var(--r-sm); border:1px solid var(--line-2); background:var(--bg-2); font-size:13px; }
.linked-mkt{ margin-top:10px; border:1px solid var(--line-2); border-radius:var(--r); padding:12px 14px; display:flex; align-items:center; gap:14px; background:var(--bg-2); transition:border-color .15s; }
.linked-mkt:hover{ border-color:var(--line-3); }
.linked-mkt .q{ font-weight:550; font-size:13.5px; flex:1; min-width:0; }
.linked-mkt .p{ font-family:var(--mono); font-size:18px; }
.composer{ padding:14px 18px; border-bottom:1px solid var(--line); display:grid; grid-template-columns:40px minmax(0,1fr); gap:12px; }
.composer .textarea{ min-height:64px; background:transparent; border-color:transparent; padding:8px 0; font-size:15px; }
.composer .textarea:focus{ background:transparent; border-color:transparent; }
.xpost{ border:1px solid var(--line-2); border-radius:var(--r); padding:14px; background:var(--bg-2); }
.xpost .body{ font-size:15px; margin-top:8px; line-height:1.5; }
mark.pred{ background:rgba(61,123,255,.2); color:#fff; border-radius:3px; padding:0 2px; box-shadow:0 0 0 1px var(--blue-line); }

/* Traders */
.tcard{ padding:18px; display:flex; flex-direction:column; gap:14px; position:relative; }
.tcard .who{ display:flex; gap:12px; align-items:center; }
.tcard .who h3{ font-size:15px; }
.tcard .who h3 a::after{ content:""; position:absolute; inset:0; }
.tcard .tstats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.tcard .tstats .k{ font-size:11.5px; color:var(--muted); }
.tcard .tstats .v{ font-family:var(--mono); font-size:15px; margin-top:2px; }
.tcard .actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; position:relative; z-index:2; }
.tcard .recent{ font-size:12px; color:var(--text-2); display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--r-sm); background:var(--blue-soft); border:1px solid var(--blue-line); position:relative; z-index:2; }
.acc-ring{ --p:70; width:44px; height:44px; border-radius:50%; background:conic-gradient(var(--blue) calc(var(--p)*1%), var(--line-2) 0); display:grid; place-items:center; flex:none; }
.acc-ring::before{ content:""; width:36px; height:36px; border-radius:50%; background:var(--card); grid-area:1/1; }
.acc-ring span{ grid-area:1/1; font-family:var(--mono); font-size:11px; z-index:1; }
.profile-hero{ display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
.profile-hero .meta{ flex:1; min-width:240px; }
.profile-hero h1{ font-size:26px; letter-spacing:-.02em; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.profile-hero p{ color:var(--text-2); margin-top:6px; max-width:60ch; }

/* ---------- Modal / toast ---------- */
.overlay{ position:fixed; inset:0; z-index:100; background:rgba(2,3,6,.72); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:20px; animation:fade .15s ease; }
.modal{ width:100%; max-width:480px; max-height:calc(100vh - 40px); overflow-y:auto; background:var(--card); border:1px solid var(--line-2); border-radius:16px; box-shadow:0 30px 80px rgba(0,0,0,.6); animation:pop .18s cubic-bezier(.2,.8,.3,1); }
.modal.wide{ max-width:640px; } .modal.xwide{ max-width:820px; }
.modal-head{ display:flex; align-items:center; gap:12px; padding:18px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--card); z-index:2; }
.modal-head h2{ font-size:17px; flex:1; }
.modal-body{ padding:20px; display:flex; flex-direction:column; gap:16px; }
.modal-foot{ padding:16px 20px; border-top:1px solid var(--line); display:flex; gap:10px; justify-content:flex-end; position:sticky; bottom:0; background:var(--card); }
@keyframes fade{ from{opacity:0} }
@keyframes pop{ from{ opacity:0; transform:translateY(8px) scale(.98);} }
.toasts{ position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:120; display:flex; flex-direction:column; gap:10px; width:min(380px, calc(100vw - 32px)); pointer-events:none; }
.toast{ pointer-events:auto; background:var(--card-3); border:1px solid var(--line-3); border-radius:12px; padding:13px 14px; display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:start; box-shadow:0 16px 40px rgba(0,0,0,.5); animation:toastIn .25s cubic-bezier(.2,.8,.3,1); }
.toast b{ font-size:13.5px; font-weight:600; display:block; }
.toast p{ font-size:12.5px; color:var(--text-2); margin-top:2px; }
.toast .ti{ width:22px; height:22px; border-radius:6px; display:grid; place-items:center; }
.toast.ok .ti{ background:var(--green-soft); color:var(--green); }
.toast.info .ti{ background:var(--blue-soft); color:#8FB2FF; }
.toast.warn .ti{ background:var(--amber-soft); color:var(--amber); }
.toast.err .ti{ background:var(--red-soft); color:var(--red); }
.toast.out{ opacity:0; transform:translateX(12px); transition:all .2s; }
@keyframes toastIn{ from{ opacity:0; transform:translateY(10px);} }

/* order preview */
.order-sum{ border:1px solid var(--line-2); border-radius:var(--r); overflow:hidden; }
.order-sum > div{ display:flex; justify-content:space-between; padding:11px 14px; border-bottom:1px solid var(--line); font-size:13.5px; }
.order-sum > div:last-child{ border-bottom:0; }
.order-sum > div span:first-child{ color:var(--muted); }
.order-sum > div span:last-child{ font-family:var(--mono); }
.sim-note{ display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border-radius:var(--r-sm); background:var(--amber-soft); border:1px solid rgba(242,181,68,.25); color:#F6D38E; font-size:12.5px; line-height:1.45; }
.sim-note .ic{ margin-top:1px; color:var(--amber); }
.receipt{ text-align:center; padding:10px 0 4px; }
.receipt .okc{ width:52px; height:52px; margin:0 auto 14px; border-radius:50%; display:grid; place-items:center; background:var(--green-soft); color:var(--green); }

/* AI pipeline */
.pipe{ display:flex; flex-direction:column; gap:2px; }
.pipe-step{ display:flex; align-items:center; gap:12px; padding:9px 0; font-size:13.5px; color:var(--muted); transition:color .2s; }
.pipe-step .pi{ width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line-3); display:grid; place-items:center; flex:none; }
.pipe-step.run{ color:var(--text); }
.pipe-step.run .pi{ border-color:var(--blue); border-top-color:transparent; animation:spin .7s linear infinite; }
.pipe-step.done{ color:var(--text-2); }
.pipe-step.done .pi{ background:var(--blue); border-color:var(--blue); color:#fff; }
.pipe-step .pt{ margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted); }
@keyframes spin{ to{ transform:rotate(360deg);} }
.detect{ border:1px solid var(--blue-line); background:linear-gradient(180deg, rgba(61,123,255,.08), rgba(61,123,255,.02)); border-radius:var(--r); padding:16px; }
.detect-q{ font-size:20px; font-weight:600; letter-spacing:-.02em; line-height:1.3; margin-top:6px; }
.conf{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--text-2); }
.conf-bar{ flex:1; height:5px; border-radius:3px; background:var(--line-2); overflow:hidden; max-width:160px; }
.conf-bar i{ display:block; height:100%; background:var(--blue); border-radius:3px; transition:width .6s cubic-bezier(.2,.8,.3,1); }
.kv{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.kv > div{ background:var(--card); padding:11px 13px; }
.kv .k{ font-size:11.5px; color:var(--muted); }
.kv .v{ font-size:13.5px; margin-top:2px; font-weight:500; }
.kv input.v{ width:100%; background:transparent; border:0; padding:0; outline:none; }
.kv input.v:focus{ color:#fff; box-shadow:0 1px 0 var(--blue); }

/* create page */
.create-hero{ border:1px solid var(--line-2); border-radius:18px; background:var(--card); padding:22px; }
.create-hero .textarea{ min-height:120px; font-size:17px; background:var(--bg-2); padding:14px 16px; }
.create-layout{ display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:20px; align-items:start; }
.preview-card{ position:sticky; top:calc(var(--top) + 20px); }
.powered{ display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--text-2); padding:5px 10px 5px 8px; border-radius:999px; border:1px solid var(--line-2); background:var(--bg-2); }
.powered svg{ width:14px; height:14px; color:var(--purple); }

/* skeletons */
.sk{ background:linear-gradient(90deg, var(--card-2) 0%, var(--card-3) 50%, var(--card-2) 100%); background-size:200% 100%; animation:sk 1.2s ease-in-out infinite; border-radius:6px; }
@keyframes sk{ from{ background-position:200% 0;} to{ background-position:-200% 0;} }
.empty{ text-align:center; padding:48px 20px; color:var(--text-2); }
.empty .ei{ width:48px; height:48px; border-radius:12px; margin:0 auto 14px; display:grid; place-items:center; background:var(--card-2); border:1px solid var(--line-2); color:var(--text-2); }
.empty h3{ color:var(--text); font-size:16px; margin-bottom:6px; }
.empty p{ max-width:40ch; margin:0 auto 16px; font-size:13.5px; }

/* tooltip */
[data-tip]{ position:relative; }
[data-tip]:hover::after{ content:attr(data-tip); position:absolute; bottom:calc(100% + 8px); left:50%; transform:translateX(-50%); background:var(--card-3); border:1px solid var(--line-3); color:var(--text); font-size:12px; font-weight:400; padding:6px 9px; border-radius:6px; white-space:normal; width:max-content; max-width:240px; z-index:50; pointer-events:none; line-height:1.4; text-align:left; letter-spacing:0; font-family:var(--font); }

/* search overlay */
.search-modal{ width:100%; max-width:640px; background:var(--card); border:1px solid var(--line-2); border-radius:16px; overflow:hidden; align-self:flex-start; margin-top:8vh; box-shadow:0 30px 80px rgba(0,0,0,.6); animation:pop .15s ease; }
.search-modal .sin{ display:flex; align-items:center; gap:12px; padding:0 18px; border-bottom:1px solid var(--line); }
.search-modal input{ flex:1; height:56px; background:none; border:0; outline:none; font-size:16px; }
.sres{ max-height:60vh; overflow-y:auto; padding:8px; }
.sres h5{ font-size:11.5px; color:var(--muted); font-weight:500; padding:10px 10px 6px; margin:0; }
.sres a, .sres button.sr-item{ display:flex; align-items:center; gap:12px; padding:9px 10px; border-radius:8px; width:100%; text-align:left; }
.sres a:hover, .sres a.act{ background:var(--card-2); }

/* notifications */
.notif{ display:grid; grid-template-columns:36px 1fr auto; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); align-items:start; }
.notif.unread{ background:linear-gradient(90deg, rgba(61,123,255,.06), transparent 60%); }
.notif .ni{ width:36px; height:36px; border-radius:10px; display:grid; place-items:center; background:var(--card-2); border:1px solid var(--line-2); color:var(--text-2); }
.notif p{ font-size:13.5px; }
.notif .when{ font-size:12px; color:var(--muted); white-space:nowrap; }
.notif-pop{ position:absolute; right:0; top:44px; width:380px; max-height:460px; overflow:auto; }

/* demo guide */
.guide{ position:fixed; left:calc(var(--side) + 20px); bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:90; width:320px; background:var(--card-3); border:1px solid var(--line-3); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.55); overflow:hidden; }
.guide-head{ display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; }
.guide-head b{ font-size:13px; flex:1; }
.guide-prog{ height:3px; background:var(--line-2); }
.guide-prog i{ display:block; height:100%; background:var(--blue); transition:width .4s; }
.guide ol{ list-style:none; margin:0; padding:8px 8px 10px; }
.guide li{ display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:8px; font-size:12.5px; color:var(--text-2); }
.guide li .gi{ width:18px; height:18px; border-radius:50%; border:1.5px solid var(--line-3); display:grid; place-items:center; flex:none; font-size:10px; font-family:var(--mono); color:var(--muted); }
.guide li.done{ color:var(--muted); }
.guide li.done .gi{ background:var(--green); border-color:var(--green); color:#03140B; }
.guide li.cur{ background:var(--card-2); color:var(--text); }
.guide li.cur .gi{ border-color:var(--blue); color:var(--blue); }
.guide li button{ margin-left:auto; }
.guide.min ol{ display:none; }

/* pulse for live */
.live-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); position:relative; display:inline-block; }
.live-dot::after{ content:""; position:absolute; inset:-4px; border-radius:50%; border:1.5px solid var(--green); opacity:0; animation:ping 2s ease-out infinite; }
@keyframes ping{ 0%{ transform:scale(.5); opacity:.8;} 100%{ transform:scale(1.4); opacity:0;} }
.flash{ animation:flash 1.4s ease; }
@keyframes flash{ 0%{ box-shadow:0 0 0 0 rgba(61,123,255,.6);} 100%{ box-shadow:0 0 0 14px rgba(61,123,255,0);} }

/* ---------- Landing ---------- */
.landing{ min-height:100vh; }
.l-nav{ position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:28px; height:64px; padding:0 max(24px, calc((100vw - 1240px)/2)); background:rgba(5,6,10,.8); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top,0px); box-sizing:content-box; }
.l-nav .logo{ width:auto; }
.l-nav nav{ display:flex; gap:22px; color:var(--text-2); font-size:14px; }
.l-nav nav a:hover{ color:var(--text); }
.l-wrap{ max-width:1240px; margin:0 auto; padding:0 24px; }
.l-hero{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.12fr); gap:48px; align-items:center; padding:72px 0 56px; }
.l-hero h1{ font-size:clamp(44px, 5.6vw, 76px); line-height:.98; letter-spacing:-.045em; font-weight:650; }
.l-hero h1 .l2{ display:block; color:var(--muted); }
.l-hero .sub{ font-size:18px; color:var(--text-2); margin-top:22px; max-width:46ch; line-height:1.5; }
.l-hero .ctas{ display:flex; gap:10px; margin-top:30px; flex-wrap:wrap; }
.l-hero .trust{ display:flex; gap:22px; margin-top:34px; color:var(--muted); font-size:13px; flex-wrap:wrap; }
.l-hero .trust b{ color:var(--text); font-family:var(--mono); font-weight:500; display:block; font-size:18px; }
.mock{ border:1px solid var(--line-2); border-radius:18px; background:var(--card); padding:14px; box-shadow:0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.02) inset; display:grid; grid-template-columns:1.35fr 1fr; gap:12px; font-size:12.5px; }
.mock .mp{ border:1px solid var(--line); border-radius:12px; background:var(--bg-2); padding:14px; }
.mock .mp h4{ font-size:14px; line-height:1.3; font-weight:600; }
.mock .mbig{ font-family:var(--mono); font-size:30px; letter-spacing:-.03em; line-height:1; }
.mock .mini-row{ display:flex; align-items:center; gap:8px; }
.pipeline{ position:relative; padding:28px 0 8px; }
.pipeline-track{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; position:relative; }
.pipeline-line{ position:absolute; left:4%; right:4%; top:22px; height:1px; background:var(--line-2); overflow:hidden; }
.pipeline-line i{ position:absolute; top:0; left:-20%; width:20%; height:1px; background:linear-gradient(90deg, transparent, var(--blue), var(--purple), transparent); animation:travel 4.5s cubic-bezier(.5,0,.5,1) infinite; }
@keyframes travel{ to{ left:100%; } }
.pstage{ position:relative; }
.pstage .node{ width:44px; height:44px; border-radius:12px; background:var(--card-2); border:1px solid var(--line-2); display:grid; place-items:center; color:var(--text-2); position:relative; z-index:1; margin-bottom:14px; }
.pstage:nth-child(2) .node{ color:#B8A4FF; border-color:rgba(142,107,255,.4); }
.pstage:nth-child(3) .node{ color:#8FB2FF; border-color:var(--blue-line); }
.pstage h4{ font-size:14px; }
.pstage p{ font-size:12.5px; color:var(--text-2); margin-top:4px; }
.pstage .pbox{ margin-top:12px; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--card); font-size:12px; min-height:84px; }
.l-sec{ padding:88px 0; border-top:1px solid var(--line); }
.l-sec h2{ font-size:clamp(30px,3.6vw,44px); letter-spacing:-.035em; line-height:1.05; max-width:20ch; }
.l-sec .lede{ color:var(--text-2); font-size:17px; margin-top:14px; max-width:56ch; }
.steps{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:0; margin-top:44px; border:1px solid var(--line); border-radius:16px; overflow:hidden; }
.steps > div{ padding:22px 20px 26px; border-right:1px solid var(--line); background:var(--card); }
.steps > div:last-child{ border-right:0; }
.steps .n{ font-family:var(--mono); color:var(--blue); font-size:13px; }
.steps h3{ font-size:17px; margin-top:22px; }
.steps p{ color:var(--text-2); font-size:13.5px; margin-top:6px; }
.why{ display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:start; }
.why-list{ display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
.why-list > div{ background:var(--card); padding:20px; }
.why-list h4{ font-size:15px; margin-top:12px; }
.why-list p{ font-size:13px; color:var(--text-2); margin-top:4px; }
.why-list .ic{ color:var(--blue); }
.contrast{ margin-top:28px; display:grid; gap:10px; }
.contrast div{ display:flex; gap:14px; align-items:baseline; font-size:18px; }
.contrast div span:first-child{ font-family:var(--mono); font-size:12px; color:var(--muted); width:88px; flex:none; }
.l-cta{ text-align:left; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; }
.l-foot{ border-top:1px solid var(--line); padding:28px 0 40px; color:var(--muted); font-size:12.5px; }
.l-foot .row{ justify-content:space-between; flex-wrap:wrap; }


/* ---------- Sports ---------- */
.crest{ width:34px; height:34px; border-radius:50%; display:inline-grid; place-items:center; font-family:var(--mono); font-weight:600; font-size:10px; letter-spacing:.02em; flex:none; box-shadow:inset 0 0 0 2px rgba(255,255,255,.12); }
.crest.sm{ width:22px; height:22px; font-size:7.5px; }
.crest.lg{ width:60px; height:60px; font-size:15px; box-shadow:inset 0 0 0 3px rgba(255,255,255,.14); }
.crest-pair{ display:inline-flex; flex:none; }
.crest-pair .crest + .crest{ margin-left:-8px; }
.crest-pair.lg .crest{ width:44px; height:44px; font-size:11px; }
.live-dot.red{ background:var(--red); } .live-dot.red::after{ border-color:var(--red); }

/* ---------- Generators ---------- */
function genHistory(seed, end, n, vola, ch24 = 0) {
  const r = mulberry32(seed);
  const pts = new Array(n);
  let p = end;
  for (let i = n - 1; i >= 0; i--) {
    pts[i] = p;
    const drift = (0.5 - p) * 0.004;
    p = clamp(p - drift - (r() - 0.5) * vola * 2 * (0.6 + r()), 0.03, 0.97);
  }
  if (ch24 && n > 30) {
    const k = n - 25, target = clamp(end / (1 + ch24 / 100), .03, .97), d = target - pts[k];
    for (let i = 0; i < n; i++) pts[i] = clamp(pts[i] + (i <= k ? d : d * (n - 1 - i) / (n - 1 - k)), .02, .98);
    pts[n - 1] = end;
  }
  return pts;
}
function genTraderPerf(t) {
  const r = mulberry32(hashStr(t.h));
  const n = 90, pts = [];
  let v = 0;
  for (let i = 0; i < n; i++) { v += (t.roi / n) + (r() - 0.5) * (t.risk === 'High' ? 4.2 : t.risk === 'Low' ? 1.4 : 2.6); pts.push(v); }
  const adj = t.roi - pts[n - 1];
  return pts.map((p, i) => +(p + adj * (i / (n - 1))).toFixed(2));
}
function traderHistory(t) {
  const extra = (Store.s && Store.s.traderExtra[t.h] && Store.s.traderExtra[t.h].hist) || [];
  return extra.concat(t.hist.map(([market, side, entry, won, dago]) => ({ market, side, entry, won: !!won, ret: won ? Math.round((1 - entry) / entry * 100) : -100, date: now() + dago * DAY })));
}
function genRecentTrades(m) {
  const r = mulberry32(hashStr(m.id + 'trades'));
  const names = ['CryptoAlex','SarahTrades','MarketMind','SolTrader','EventTrader','quantkai','mira','defidan','0xLena','alex'];
  const out = [];
  for (let i = 0; i < 9; i++) {
    const side = r() < m.yes ? 'YES' : 'NO';
    const p = side === 'YES' ? m.yes + (r() - .5) * .04 : (1 - m.yes) + (r() - .5) * .04;
    out.push({ a: names[Math.floor(r() * names.length)], side, price: clamp(p, .02, .98), amt: Math.round(5 + r() * r() * 900), t: now() - (i * 7 + r() * 9) * 60e3 });
  }
  return out;
}

/* ---------- Portfolio math ---------- */
const sidePrice = (m, side) => side === 'YES' ? m.yes : 1 - m.yes;
function posValue(p) { const m = Store.market(p.m); return m ? p.shares * sidePrice(m, p.side) : 0; }
function posCost(p) { return p.shares * p.entry; }
function copyValue(c) { return c.cash + c.positions.reduce((a, p) => a + posValue(p), 0); }
function portfolio() {
  const s = Store.s;
  const posVal = s.positions.reduce((a, p) => a + posValue(p), 0);
  const posPnl = s.positions.reduce((a, p) => a + posValue(p) - posCost(p), 0);
  const live = s.copies.filter(c => c.status !== 'Stopped');
  const cpVal = live.reduce((a, c) => a + copyValue(c), 0);
  const cpPnl = live.reduce((a, c) => a + copyValue(c) - c.allocation, 0);
  const invested = posVal + cpVal;
  const realized = (s.settled || []).reduce((a, r) => a + r.pnl, 0);
  return { available: s.wallet.available, invested, total: s.wallet.available + invested, pnl: posPnl + cpPnl + realized, posVal, cpVal, realized };
}

/* =====================================================================
   PANTA SERVICE
   Nexis never talks to market infrastructure directly — every read/write
   goes through `Panta`. Today it's backed by MockPantaAdapter (in-browser,
   simulated fills, no chain). A LivePantaAdapter can implement the same
   interface against Panta's API/SDK without touching any UI code.
   ===================================================================== */
const MockPantaAdapter = {
  name: 'Demo adapter',
  mode: 'mock',
  latency: () => 260 + Math.random() * 380,
  async getMarkets({ category, sort, q } = {}) {
    await delay(this.latency());
    let list = Store.markets.filter(m => !m.sub || q);
    if (q) { const s = q.toLowerCase(); list = list.filter(m => (m.q + ' ' + m.cat + ' ' + (m.icon || '')).toLowerCase().includes(s)); }
    if (category && category !== 'Trending') {
      if (category === 'Ending Soon') list = list.filter(m => m.ends > now()).sort((a, b) => a.ends - b.ends).slice(0, 8);
      else if (category === 'New') list = list.filter(m => now() - m.created < 3 * DAY).sort((a, b) => b.created - a.created);
      else list = list.filter(m => m.cat === category);
    }
    return sortMarkets(list, sort || 'Trending');
  },
  async getMarket(id) { await delay(this.latency()); const m = Store.market(id); if (!m) throw new Error('Market not found'); return m; },
  async getMarketHistory(id, range = '1M') { const m = Store.market(id); const n = { '1D': 24, '1W': 168, '1M': 720, 'ALL': 720 }[range] || 720; return m.hist.slice(-n).map((p, i, a) => ({ t: now() - (a.length - 1 - i) * HOUR, p })); },
  async createMarket(input) {
    await delay(900 + Math.random() * 500);
    if (!input.q || input.q.length < 12) throw new Error('Market question is too short.');
    if (!input.ends || input.ends <= now()) throw new Error('End date must be in the future.');
    const id = 'u-' + Math.random().toString(36).slice(2, 7);
    const m = { id, q: input.q, icon: input.icon || CAT_SHORT[input.cat] || 'MKT', cat: input.cat, yes: .5, vol: 0, liq: 500, traders: 0, oi: 0, change24: 0, ends: input.ends, created: now(), vola: .01,
      src: input.src, criteria: input.criteria, desc: input.desc || '', origin: input.origin || null, userCreated: true, creator: 'you', bull: .5,
      yesF: input.yesF || [], noF: input.noF || [], social: 'New market. No discussion yet — be the first to post your view.' };
    Store.s.created.unshift(m);
    Store.hydrateMarkets();
    return { market: Store.market(id), receipt: { ref: 'SIM-MKT-' + (++Store.s.orderSeq), simulated: true } };
  },
  async buyPosition({ marketId, side, amount, account = 'you' }) {
    await delay(700 + Math.random() * 500);
    const m = Store.market(marketId);
    if (!m) throw new Error('Market not found');
    if (m.resolved) throw new Error(`This market resolved ${m.resolved}. Trading is closed.`);
    if (m.pm ? m.accepting === false : m.ends <= now()) throw new Error('This market has stopped trading and is awaiting resolution.');
    if (!(amount > 0)) throw new Error('Enter an amount greater than $0.');
    if (m.ext) { // live market: paper fill at the current live price, no impact on the real book
      const price = clamp(fillPrice(m, side, 'buy'), .001, .999);
      m.paperVol = (m.paperVol || 0) + amount; if (!m.pm) m.vol += amount;
      return { ref: 'PAPER-' + (++Store.s.orderSeq), simulated: true, paper: true, marketId, side, amount, price, shares: amount / price, account, t: now() };
    }
    const price = sidePrice(m, side);
    const shares = amount / price;
    const impact = Math.min(.08, amount / m.liq * .25);
    Store.setMarketPrice(m.id, m.yes + (side === 'YES' ? impact : -impact));
    Store.bumpMarket(m.id, { vol: m.vol + amount, traders: m.traders + 1, oi: m.oi + amount, liq: m.liq + amount * .1 });
    return { ref: 'SIM-' + (++Store.s.orderSeq), simulated: true, marketId, side, amount, price, shares, account, t: now() };
  },
  async sellPosition({ positionId, fraction = 1 }) {
    await delay(600 + Math.random() * 400);
    const p = Store.s.positions.find(x => x.id === positionId);
    if (!p) throw new Error('Position not found');
    const m = Store.market(p.m);
    if (m.ext) { const shares = p.shares * fraction, price = clamp(fillPrice(m, p.side, 'sell'), 0, 1); return { ref: 'PAPER-' + (++Store.s.orderSeq), simulated: true, paper: true, shares, price, proceeds: shares * price }; }
    const shares = p.shares * fraction, price = sidePrice(m, p.side), proceeds = shares * price;
    const impact = Math.min(.06, proceeds / m.liq * .25);
    Store.setMarketPrice(m.id, m.yes + (p.side === 'YES' ? -impact : impact));
    return { ref: 'SIM-' + (++Store.s.orderSeq), simulated: true, shares, price, proceeds };
  },
  async getPositions() { await delay(this.latency()); return Store.s.positions.slice(); },
  async resolveMarket(id, outcome) { await delay(600); Store.bumpMarket(id, { resolved: outcome }); return { id, outcome, simulated: true }; },
};

function sortMarkets(list, sort) {
  const l = list.slice();
  if (sort === 'Highest Volume') l.sort((a, b) => (!!a.resolved - !!b.resolved) || b.vol - a.vol);
  else if (sort === 'Biggest Movers') l.sort((a, b) => Math.abs(b.change24) - Math.abs(a.change24));
  else if (sort === 'Ending Soon') l.sort((a, b) => (a.ends <= now()) - (b.ends <= now()) || a.ends - b.ends);
  else if (sort === 'Newest') l.sort((a, b) => b.created - a.created);
  else l.sort((a, b) => (!!a.resolved - !!b.resolved) || (b.vol / 1e5 * (1 + Math.abs(b.change24) / 8) + (b.userCreated ? 50 : 0)) - (a.vol / 1e5 * (1 + Math.abs(a.change24) / 8) + (a.userCreated ? 50 : 0)));
  return l;
}

let sampleFn = null;

Post: """${text.slice(0, 600)}"""

Rules: question must be objectively resolvable YES/NO with a concrete date; write prices in full with commas (e.g. $150,000); interpret "before <Month>" as before the 1st of that month unless the month is December, then use December 31 and note it as an assumption.`;

    } catch (e) { return { ...local, engine: 'local', fellBack: true }; }
  },

  parseLocal(raw) {
    const text = String(raw || '').trim();
    const t = text.replace(/[“”]/g, '"');
    const lower = t.toLowerCase();

    const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
    let asset = null, assetIdx = -1;
    for (const k of Object.keys(ASSETS)) { const re = new RegExp('(^|[^a-z$])\\$?' + k + '(?![a-z])', 'i'); const mm = re.exec(t); if (mm) { asset = ASSETS[k]; assetIdx = mm.index; break; } }
    let price = null;

    if (pm) { price = parseFloat(pm[1].replace(/,/g, '')); const u = (pm[2] || '').toLowerCase(); if (u === 'k') price *= 1e3; if (u === 'm') price *= 1e6; if (u === 'b') price *= 1e9; }
    const down = /(drop|fall|dump|crash|below|under|sink)/i.test(t);

    if (mBefore) {
      deadlineMatched = true;
      const mi = MONTHS.indexOf(mBefore[2].toLowerCase());
      const day = mBefore[3] ? +mBefore[3] : null;
      const endOf = /end of/i.test(mBefore[1]) || /end of/i.test(mBefore[0]);
      let yr = yNow;
      if (endOf || mi === 11) {
        const d = new Date(Date.UTC(yr, mi + 1, 0, 23, 59));
        if (d.getTime() < now()) yr++;
        ends = Date.UTC(yr, mi + 1, 0, 23, 59); dLabel = fmtDate(ends, { month: 'long', day: 'numeric' });
        if (!endOf && mi === 11) assumption = '“Before December” read as by year-end (December 31). Edit the deadline if you meant December 1.';
      } else {

      }
    } else if (/this year|by (the )?eoy|end of (the )?year|by year.?end/i.test(t)) { deadlineMatched = true; ends = Date.UTC(yNow, 11, 31, 23, 59); dLabel = 'December 31'; }
    else if (/tonight|today/i.test(t)) { deadlineMatched = true; ends = now() + 10 * HOUR; dLabel = 'tonight'; }
    else if (/next week/i.test(t)) { deadlineMatched = true; ends = now() + 9 * DAY; dLabel = fmtDate(now() + 9 * DAY, { month: 'long', day: 'numeric' }); }
    else if (/this week/i.test(t)) { deadlineMatched = true; ends = now() + 5 * DAY; dLabel = 'the end of this week'; }
    else if (/next month/i.test(t)) { deadlineMatched = true; const d = new Date(); ends = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 2, 1); dLabel = fmtDate(ends, { month: 'long', day: 'numeric' }); }
    if (!ends) { ends = now() + 30 * DAY; dLabel = fmtDate(ends, { month: 'long', day: 'numeric' }); assumption = 'No deadline found in the post. Defaulted to 30 days — set the one you want.'; }

    const predictive = /(will|gonna|going to|calling it|bet|by|before|hit|reach|flip|win|pass|break|mark my words|incoming|predict)/i.test(t);
    let q, cat, src, criteria, confidence = 40, kind = 'generic', icon = 'MKT';
    const fmtPrice = (n) => '$' + (n >= 1 ? n.toLocaleString('en-US', { maximumFractionDigits: n < 10 ? 2 : 0 }) : n.toString());
    if (asset && price) {

      q = `Will ${asset} ${down ? 'fall below' : 'reach'} ${fmtPrice(price)} before ${dLabel}?`;
      src = `${asset}/USD price oracle (Pyth, hourly close)`;
      criteria = `Resolves YES if any hourly close of ${asset}/USD prints ${down ? 'at or below' : 'at or above'} ${fmtPrice(price)} before ${fmtDate(ends, { month: 'long', day: 'numeric', year: 'numeric' })}${new Date(ends).getUTCHours() ? ' 23:59 UTC' : ' 00:00 UTC'}. Otherwise NO.`;
      confidence = 70 + (deadlineMatched ? 14 : 0) + (/will|hit|reach|break/i.test(t) ? 10 : 4);
    } else if (/\bwin(s)?\b/i.test(t)) {

      const sm = /([A-Z][\w.&' ]{1,30}?)\s+(?:will|gonna|going to|to)?\s*win/i.exec(t);
      const team = sm ? sm[1].trim().replace(/^(i think|calling it:?|imo)\s+/i, '') : 'The team';
      const what = /tonight/i.test(t) ? 'tonight' : /(final|cup|league|title|championship)/i.exec(t)?.[0] ? 'the ' + /(final|cup|league|title|championship)/i.exec(t)[0].toLowerCase() : 'their next match';
      q = `Will ${team} win ${what}?`; src = 'Official match result'; icon = team.slice(0, 3).toUpperCase();

      const nm = /(\d+(?:\.\d+)?)\s*(k|m)?\s*(views|subs|subscribers|followers|streams|likes)/i.exec(t);
      const n = nm ? (nm[1] + (nm[2] || '').toUpperCase()) : '1M';
      const metric = nm ? nm[3].toLowerCase() : 'views';
      q = `Will the post’s creator reach ${n} ${metric} before ${dLabel}?`; src = 'Public platform counter'; icon = 'CRE';
      criteria = `Resolves YES if the public counter shows ${n} ${metric} or more before the deadline, verified by timestamped screenshots.`;
      confidence = 58 + (nm ? 18 : 0) + (deadlineMatched ? 10 : 0);
    } else {
      cat = /(fed|rate|election|president|senate|inflation|cpi|war|policy|law)/i.test(t) ? 'News' : /(trailer|album|movie|film|show|season|release|box office)/i.test(t) ? 'Entertainment' : 'Community';
      let core = t.replace(/^(i think|calling it[:,]?|mark my words[:,]?|imo[:,]?|hot take[:,]?)\s*/i, '').replace(/[.!]+$/, '');
      const wm = /^(.+?)\s+will\s+(.+)$/i.exec(core);
      q = wm ? `Will ${wm[1]} ${wm[2].replace(/\s+(before|by)\s+.+$/i, '')} before ${dLabel}?` : `Will this happen before ${dLabel}: “${core.slice(0, 80)}”?`;

/* =====================================================================
   COPY-TRADING ENGINE (simulated)
   Mirrors a followed trader's NEW trades into each active copy, applying
   the copier's rules. No funds move; allocation comes from demo balance.
   ===================================================================== */
const CopyEngine = {
  start(h, cfg) {
    const s = Store.s;
    if (cfg.allocation > s.wallet.available) throw new Error(`Allocation exceeds your available balance (${usd(s.wallet.available)}).`);
    s.wallet.available = +(s.wallet.available - cfg.allocation).toFixed(2);
    const c = { id: uid('cp'), h, allocation: cfg.allocation, cash: cfg.allocation, maxPer: cfg.maxPer, dailyMax: cfg.dailyMax, cats: cfg.cats, sports: cfg.sports || [], types: cfg.types || [], auto: cfg.auto, stopLoss: cfg.stopLoss, status: 'Active', trades: 0, started: now(), positions: [], log: [{ t: now(), ok: true, text: `Started copying with ${usd(cfg.allocation)} allocation` }] };
    s.copies.unshift(c);
    return c;
  },
  stop(id) {
    const s = Store.s, c = s.copies.find(x => x.id === id); if (!c) return;
    const v = copyValue(c);
    s.wallet.available = +(s.wallet.available + v).toFixed(2);
    c.status = 'Stopped'; c.positions = []; c.cash = 0; c.log.unshift({ t: now(), ok: true, text: `Stopped. Returned ${usd(v)} to your balance (simulated close at market).` });
  },
  togglePause(id) { const c = Store.s.copies.find(x => x.id === id); if (c) { c.status = c.status === 'Paused' ? 'Active' : 'Paused'; c.log.unshift({ t: now(), ok: true, text: c.status === 'Paused' ? 'Paused — new trades won’t be copied' : 'Resumed' }); } },
  // trader closed or cut a position: close the same share of the copied position at the live price
  onTraderClose(h, marketId, side, fraction = 1) {
    const out = [];
    for (const c of Store.s.copies) {
      if (c.h !== h || c.status !== 'Active' || !c.auto) continue;
      const p = c.positions.find(x => x.m === marketId && x.side === side); const m = Store.market(marketId); if (!p || !m) continue;
      const f = clamp(fraction, 0, 1), sh = p.shares * f, px = m.ext ? fillPrice(m, side, 'sell') : sidePrice(m, side), v = sh * px;
      p.shares -= sh; if (p.shares < 1e-6) c.positions = c.positions.filter(x => x !== p);
      c.cash = +(c.cash + v).toFixed(4);
      c.log.unshift({ t: now(), ok: true, text: `${f >= .999 ? 'Closed' : 'Reduced'} ${side} on “${m.q}” with @${hName(h)} · ${usd(v)} at ${cents(px)}` });
      out.push({ c, v, pnl: v - sh * p.entry, m });
    }
    return out;
  },
  // called whenever a trader trade happens (simulated demo traders, or live Polymarket traders)
  onTraderTrade(h, trade) {
    const results = [];
    for (const c of Store.s.copies) {
      if (c.h !== h || c.status !== 'Active' || !c.auto) continue;
      const m = Store.market(trade.m); if (!m) continue;
      const today = c.log.filter(l => l.ok && l.amt && now() - l.t < DAY).reduce((a, l) => a + l.amt, 0);
      let reason = null;
      if (!c.cats.includes(m.cat)) reason = `${m.cat} isn’t in your filter`;
      else if (m.sport && c.sports && c.sports.length && !c.sports.includes(m.sport)) reason = `${m.sport} isn’t in your sports filter`;
      else if (m.group && c.types && c.types.length && !c.types.includes(m.group === 'Player' ? 'Player' : 'Match')) reason = `${m.group === 'Player' ? 'Player' : 'Match'} markets aren’t in your filter`;
      else if (m.resolved) reason = 'Market already resolved';
      else if (c.stopLoss && copyValue(c) < c.allocation * .8) reason = 'Stop rule hit: copy is down 20%';
      else if (today >= c.dailyMax) reason = `Daily limit of ${usd(c.dailyMax, 0)} reached`;
      else if (c.cash < 1) reason = 'No allocation left';
      if (reason) { c.log.unshift({ t: now(), ok: false, text: `Skipped ${trade.side} on “${m.q}” — ${reason}` }); results.push({ c, skipped: reason }); continue; }
      const amt = +Math.min(c.maxPer, trade.amount, c.cash, c.dailyMax - today).toFixed(2);
      const price = m.ext ? clamp(fillPrice(m, trade.side, 'buy'), .001, .999) : sidePrice(m, trade.side);
      const shares = amt / price;
      const ex = c.positions.find(p => p.m === m.id && p.side === trade.side);
      if (ex) { ex.entry = (ex.entry * ex.shares + amt) / (ex.shares + shares); ex.shares += shares; } else c.positions.push({ m: m.id, side: trade.side, shares, entry: price, t: now() });
      c.cash = +(c.cash - amt).toFixed(4); c.trades++;
      c.log.unshift({ t: now(), ok: true, amt, text: `Copied ${trade.side} on “${m.q}” · ${usd(amt)} at ${cents(price)}` });
      results.push({ c, amt, price, m });
    }
    return results;
  },
};

/* Simulated activity from demo traders */
async function simulateTraderTrade(h, marketId, side, amount) {
  let r;
  try { r = await Panta.buyPosition({ marketId, side, amount, account: h }); } catch (e) { return { r: null, copied: [] }; }
  const x = Store.s.traderExtra[h] = Store.s.traderExtra[h] || { active: [] };
  const prior = Store.trader(h)?.active.find(a => a[0] === marketId && a[1] === side);
  x.active = x.active.filter(a => a[0] !== marketId); x.closed = (x.closed || []).filter(id => id !== marketId);
  const size = prior ? prior[3] + amount : amount, entry = prior ? (prior[2] * prior[3] + r.price * amount) / size : r.price;
  x.active.unshift([marketId, side, entry, size]);
  x.recent = { m: marketId, side, price: r.price, amount, t: now() };
  const m = Store.market(marketId);
  Tracker.nexisAct(h, { kind: prior ? 'resize' : 'open', m: marketId, title: m.q, side, price: r.price, usd: amount, delta: amount, sports: !!m.eventId });
  Store.s.posts.unshift({ id: uid('p'), a: h, t: now(), type: 'trade', text: `Bought ${side} on “${m.q}” at ${cents(r.price)}.`, m: marketId, side, price: r.price, likes: 0, comments: 0, reposts: 0, sim: true });
  (Store.s.comments[marketId] = Store.s.comments[marketId] || []).unshift({ a: h, t: now(), text: `Took ${side} at ${cents(r.price)}.`, side, likes: 0, sim: true });
  if (Store.isFollowing(h) || Store.copyOf(h)) Store.notify({ kind: 'follow_trade', icon: 'trend', text: `<b>@${h}</b> opened a position: ${side} on <b>${esc(m.q)}</b> at ${cents(r.price)}`, href: '#/market/' + marketId });
  const copied = CopyEngine.onTraderTrade(h, { m: marketId, side, amount });
  copied.forEach(res => {
    if (res.skipped) Store.notify({ kind: 'copy_skip', icon: 'info', text: `Skipped copying <b>@${h}</b> on <b>${esc(m.q)}</b> — ${esc(res.skipped)}`, href: '#/copy' });
    else Store.notify({ kind: 'copy_trade', icon: 'copy', text: `Copied <b>@${h}</b>: ${side} on <b>${esc(m.q)}</b> · ${usd(res.amt)} (simulated)`, href: '#/copy' });
  });
  Store.emit('trade');
  return { r, copied };
}

function positionsRows(rows, { withSell = true } = {}) {

function tradeCalc(m, tr) {
  const price = sidePrice(m, tr.side); const amt = +tr.amt || 0; const shares = amt / price;
  return { price, amt, shares, payout: shares, ret: amt ? (shares - amt) / amt * 100 : 0, profit: shares - amt };
}
function tradePanel(m, tr) {
  const c = tradeCalc(m, tr); const ended = m.ends <= now() || !!m.resolved;
  return `<div class="row"><h3 style="font-size:15px">Trade</h3><span class="tag demo" style="margin-left:auto">${m.ext ? 'paper · live price' : 'simulated fills'}</span></div>
    <div class="side-toggle"><button class="btn btn-yes ${tr.side === 'YES' ? 'on' : ''}" data-action="side" data-id="${m.id}" data-side="YES"><span>Buy ${esc(m.yesLabel || 'YES')}</span><b data-lp="${m.id}">${cents(m.yes)}</b></button><button class="btn btn-no ${tr.side === 'NO' ? 'on' : ''}" data-action="side" data-id="${m.id}" data-side="NO"><span>Buy ${esc(m.noLabel || 'NO')}</span><b data-lpn="${m.id}">${cents(1 - m.yes)}</b></button></div>
    <label class="field"><span>Amount</span><div class="input-affix"><input class="input" id="amt-${m.id}" data-amt="${m.id}" inputmode="decimal" value="${tr.amt}" aria-label="Amount in dollars"></div></label>
    <div class="presets">${[5, 10, 25, 50, 100].map(v => `<button data-action="preset" data-id="${m.id}" data-v="${v}">$${v}</button>`).join('')}<button data-action="preset" data-id="${m.id}" data-v="max">Max</button></div>

const clockHtml = (ev) => `<span data-evclock="${ev.id}">${Live.clockLabel(ev)}</span>`;
function evBadge(ev) {
  const s = Live.status(ev);
  if (s === 'live') return `<span class="live-badge"><span class="live-dot red"></span>LIVE ${clockHtml(ev)}</span>`;
  if (s === 'final') return `<span class="tag">Final</span>`;

}
const scoreText = (ev) => { const s = Live.score(ev); return s ? `${s[0]}–${s[1]}` : 'vs'; };
const tname = (code, short) => short ? (TEAMS[code].s || TEAMS[code].name) : TEAMS[code].name;
function scoreboard(ev, big = false) {
  if (ev.race) return `<div class="sb ${big ? 'big' : ''}"><div class="sb-race">${ic('racing', big ? 'lg' : '')}<div><b>${esc(ev.round)}</b><div class="mut" style="font-size:12px">${esc(ev.venue)}</div></div></div></div>`;
  const H = { name: tname(ev.home, !big) }, A = { name: tname(ev.away, !big) };
  return `<div class="sb ${big ? 'big' : ''}"><div class="sb-team">${crest(ev.home, big ? 'lg' : '')}<span>${esc(H.name)}</span></div><div class="sb-score num" data-evscore="${ev.id}">${scoreText(ev)}</div><div class="sb-team r"><span>${esc(A.name)}</span>${crest(ev.away, big ? 'lg' : '')}</div></div>`;
}
/* outcome buttons: the headline market(s) of an event */
function outcomes(ev, short = false) {
  const M = (id) => Store.market(id); const nm = (c) => short && ev.sport === 'Football' ? c : tname(c, short);
  let list = [];
  if (ev.sport === 'Football') list = [[ev.primary, nm(ev.home), 'YES'], [ev.id + '-draw', 'Draw', 'YES'], [ev.id + '-away', nm(ev.away), 'YES']];
  else if (ev.race) list = ev.markets.map(M).filter(m => m.driver).map(m => [m.id, m.label, 'YES']);
  else list = [[ev.primary, nm(ev.home), 'YES'], [ev.primary, nm(ev.away), 'NO']];
  return list.map(([id, name, side]) => { const m = M(id); if (!m) return ''; const p = side === 'YES' ? m.yes : 1 - m.yes; const res = m.resolved ? (m.resolved === side ? 'won' : 'lost') : '';
    return `<button class="oc ${res}" data-action="evPick" data-id="${id}" data-side="${side}" ${m.resolved ? 'disabled' : ''}><span class="oc-n">${esc(name)}</span><b class="num" ${side === 'YES' ? `data-lp="${id}"` : `data-lpn="${id}"`}>${m.resolved ? (res === 'won' ? '✓ Won' : 'Lost') : cents(p)}</b></button>`; }).join('');
}
function eventCard(ev, { compact = false } = {}) {
  const s = Live.status(ev); const ms = ev.markets.map(id => Store.market(id)).filter(Boolean);
  const vol = ms.reduce((a, m) => a + m.vol, 0);

/* Shape of a real adapter (Auth0 / Clerk / Supabase / Privy / Dynamic, etc.) — same method names:
const ProviderAuthAdapter = { name:'Your provider', mode:'live', current(), signUpWithPassword(), signInWithPassword(), verify2FA(), sendMagicLink(), verifyMagicLink(),
  signInWithGoogle(), walletNonce(), signInWithWallet(), requestPasswordReset(), resetPassword(), signOut(), updateProfile(), changePassword(), linkWallet(), unlinkWallet(), ... }
*/
const Auth = {
  adapter: MockAuthAdapter,
  init() { this.adapter.load(); },
  get user() { return this.adapter.current(); },
  methods(u) { return this.adapter.methods(u || this.user); },
};
Auth.init();

/* ---------- identity helpers used across the app ---------- */
const meHandle = () => (Auth.user && Auth.user.handle) || 'you';
const meName = () => { const u = Auth.user; if (!u) return 'Guest'; return u.name || u.handle || (u.email ? u.email.split('@')[0] : '') || (u.wallets[0] ? shortAddr(u.wallets[0].address) : 'You'); };
const meInitials = () => { const n = meName().trim(); const p = n.split(/\s+/); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : (p[0] || '')[1] || '')).toUpperCase(); };
const primaryWallet = () => Auth.user && (Auth.user.wallets.find(w => w.primary) || Auth.user.wallets[0]);

function onAuthed(res) {
  if (res.needs2FA) { UI.auth.pending = res; UI.auth.view = 'twofa'; closeModal(true); if (!['login', 'signup'].includes(current.route)) location.hash = '#/login'; else refreshAuth(); return; }
  const u = res.user;

  Live.attach(); setTimeout(() => WalletLive.attach(), 500);
  closeModal(true);
  const next = UI.auth.next; const demo = UI.auth.demo; UI.auth = { view: 'main', email: '', pending: null, next: '', demo };
  if (res.isNew) { location.hash = '#/onboarding'; return; }
  toast({ title: `Welcome back${u.name ? ', ' + u.name.split(' ')[0] : ''}`, body: `Signed in with ${res.session.method}.` });
  UI.auth.demo = '';
  location.hash = next && !/^\/?(login|signup|forgot|onboarding)/.test(next) ? '#' + next.replace(/^#/, '') : '#/home';
  if (demo) setTimeout(() => startDemo(demo), 400);
}
function authErrorHtml(msg) { return msg ? `<div class="auth-err" role="alert">${ic('alert', 'sm')}<span>${esc(msg)}</span></div>` : ''; }
function setBusy(btn, busy, label) { if (!btn) return; if (busy) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${label || 'Working…'}`; } else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; } }

function siwsMessage(address, nonce) {
  return `nexis.app wants you to sign in with your Solana account:\n${address}\n\nSign in to Nexis. This request will not trigger a transaction or cost any fees.\n\nURI: https://nexis.app\nVersion: 1\nChain ID: mainnet\nNonce: ${nonce}\nIssued At: ${new Date().toISOString()}`;
}
function openWalletFlow({ mode = 'login', onDone } = {}) {
  const title = mode === 'login' ? 'Continue with Wallet' : 'Link a wallet';

async function walletConnect(id) {
  const w = WALLETS.find(x => x.id === id); const prov = w.get(); const F = UI.walletFlow;
  setModal(`${modalHead(`Connect ${w.name}`)}<div class="modal-body"><div class="wstep">${walletIcon(w, 52)}<div class="spin lg"></div></div><p style="text-align:center">${prov ? `Approve the connection request in ${w.name}.` : `Connecting a simulated ${w.name} wallet…`}</p></div>`);

  try {
    if (prov) { const r = await prov.connect(); address = (r && r.publicKey ? r.publicKey : prov.publicKey).toString(); real = true; }
    else { await delay(700); address = randB58(44); }
  } catch (e) { return setModal(`${modalHead(`Connect ${w.name}`)}<div class="modal-body">${emptyState({ icon: 'alert', title: 'Connection cancelled', body: 'The request was rejected or closed in your wallet.' })}</div><div class="modal-foot"><button class="btn btn-ghost" data-action="walletBack">Choose another wallet</button></div>`); }
  const nonce = await Auth.adapter.walletNonce(address); const msg = siwsMessage(address, nonce);

  setModal(`${modalHead('Verify ownership', `${w.name} · ${shortAddr(address)}${real ? '' : ' · demo address'}`)}<div class="modal-body">
    <div class="row" style="gap:12px">${walletIcon(w, 40)}<div><b class="num">${shortAddr(address)}</b><div class="mut" style="font-size:12px">Connected${real ? '' : ' (simulated)'}</div></div><span class="tag green" style="margin-left:auto">${ic('check', 'sm')}Connected</span></div>

  </div><div class="modal-foot"><button class="btn btn-ghost" data-action="walletBack">Back</button><button class="btn btn-blue" data-action="walletSign" autofocus>${ic('key', 'sm')}Sign message</button></div>`);
}
async function walletSign(btn) {
  const F = UI.walletFlow; const p = F.pending; setBusy(btn, true, 'Waiting for signature…');
  let signature;
  try {
    if (p.real) { const r = await p.prov.signMessage(new TextEncoder().encode(p.msg), 'utf8'); const bytes = r && r.signature ? r.signature : r; signature = Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(''); }
    else { await delay(650); signature = 'demo-' + randB58(40); }
  } catch (e) { setBusy(btn, false); return toast({ title: 'Signature declined', body: 'Nothing was signed. You can try again.', kind: 'warn' }); }
  try {
    if (F.mode === 'login') { const res = await Auth.adapter.signInWithWallet({ address: p.address, label: p.w.name, signature, real: p.real }); onAuthed(res); }
    else {
      await Auth.adapter.linkWallet({ address: p.address, label: p.w.name, real: p.real });

    }
  } catch (e) { setBusy(btn, false); toast({ title: 'Couldn’t verify wallet', body: esc(e.message), kind: 'err' }); }
}

/* ---------- small helpers for forms ---------- */
function showErr(form, msg) { const e = form.querySelector('[data-err]'); if (e) e.innerHTML = authErrorHtml(msg); }
function meterUpdate(inp) { const m = inp.closest('.field').querySelector('[data-meter]'); if (!m) return; const s = inp.value ? pwStrength(inp.value) : -1; m.querySelectorAll('i').forEach((el, i) => el.className = i <= s - 1 || (s === 0 && i === 0 && inp.value) ? 'on s' + Math.max(1, s) : ''); m.querySelector('span').textContent = inp.value ? PW_LABEL[s] + (s < 2 ? ' — add length, numbers or symbols' : '') : 'Use 8+ characters with letters and numbers'; }
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches && t.matches('[data-strength]')) meterUpdate(t);
  if (t.matches && t.matches('[data-handle]')) { const msg = t.closest('.field').querySelector('[data-handle-msg]'); const h = t.value.replace(/^@/, ''); const u = Auth.user; const ok = /^[A-Za-z0-9_]{3,20}$/.test(h); const free = ok && MockAuthAdapter.handleFree(h, u && u.id); msg.innerHTML = !ok ? `<span style="color:var(--amber)">3–20 letters, numbers or underscores</span>` : free ? `<span class="up">${ic('check', 'sm')} @${esc(h)} is available</span>` : `<span class="down">@${esc(h)} is taken</span>`; }
  if (t.name === 'bio') { const c = $('[data-bio-count]'); if (c) c.textContent = t.value.length; }
  if (t.name === 'name' && $('#onb-av')) { /* live initials */ }
});
document.addEventListener('submit', async (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const kind = f.dataset.form; const fd = new FormData(f); const btn = f.querySelector('[type=submit]'); showErr(f, '');
  const go = async (label, fn) => { setBusy(btn, true, label); try { await fn(); } catch (err) { showErr(f, err.message); setBusy(btn, false); } };
  if (kind === 'login') return go('Logging in…', async () => { UI.auth.email = fd.get('email'); if (!fd.get('password')) throw aerr('x', 'Enter your password.'); onAuthed(await Auth.adapter.signInWithPassword({ email: fd.get('email'), password: fd.get('password'), remember: !!fd.get('remember') })); });
  if (kind === 'signup') return go('Creating account…', async () => { UI.auth.email = fd.get('email'); if (!fd.get('terms')) throw aerr('x', 'Please accept the terms to continue.'); onAuthed(await Auth.adapter.signUpWithPassword({ email: fd.get('email'), password: fd.get('password') })); });
  if (kind === 'magic') return go('Sending…', async () => { const email = String(fd.get('email') || '').trim(); const r = await Auth.adapter.sendMagicLink(email); UI.auth.email = email; UI.auth.token = r.demoToken; UI.auth.view = 'emailSent'; refreshAuth(); });
  if (kind === 'twofa') return go('Verifying…', async () => { onAuthed(await Auth.adapter.verify2FA({ ...UI.auth.pending, code: fd.get('code') })); });
  if (kind === 'google') return go('Signing in…', async () => { if (f.dataset.mode === 'link') { await Auth.adapter.linkGoogle({ email: fd.get('email'), name: fd.get('name') }); closeModal(); toast({ title: 'Google account connected' }); refresh(); } else onAuthed(await Auth.adapter.signInWithGoogle({ email: fd.get('email'), name: String(fd.get('name') || '').trim() })); });
  if (kind === 'forgot') return go('Sending…', async () => { const email = String(fd.get('email') || '').trim(); const r = await Auth.adapter.requestPasswordReset(email); UI.forgot = { step: 2, email, code: r.demoCode }; refresh(); });
  if (kind === 'reset') return go('Resetting…', async () => { await Auth.adapter.resetPassword({ email: UI.forgot.email, code: fd.get('code'), password: fd.get('password') }); UI.auth.email = UI.forgot.email; UI.forgot = null; toast({ title: 'Password updated', body: 'Log in with your new password.' }); location.hash = '#/login'; });
  if (kind === 'onboard') return go('Setting up…', async () => {
    const u = Auth.user; await Auth.adapter.updateProfile({ name: String(fd.get('name') || '').trim(), handle: fd.get('handle'), hue: UI.onb.hue, onboarded: true, interests: fd.getAll('interest') });
    if (!fd.get('sample')) { Store.s = Store.fresh({ empty: true, walletLinked: u.wallets.length > 0 }); Store.hydrateMarkets(); Live.attach(); Store.save(); }
    UI.onb = null; const demo = UI.auth.demo; UI.auth.demo = '';
    location.hash = '#/home'; setTimeout(() => toast({ title: `Welcome to Nexis, @${Auth.user.handle}`, body: Store.s.wallet.connected ? `${usd(Store.s.wallet.available)} demo USDG is ready to trade.` : 'Link a wallet when you’re ready to trade.' }), 300);
    if (demo) setTimeout(() => startDemo(demo), 700);
  });
  if (kind === 'profile') return go('Saving…', async () => { await Auth.adapter.updateProfile({ name: String(fd.get('name') || '').trim(), handle: fd.get('handle'), bio: String(fd.get('bio') || ''), hue: +fd.get('hue'), prefs: { publicPositions: !!fd.get('publicPositions'), showOnLeaderboard: !!fd.get('showOnLeaderboard'), publicBalance: !!fd.get('publicBalance') } }); toast({ title: 'Profile saved' }); refresh(); });
  if (kind === 'password') return go('Saving…', async () => { if (fd.get('next') !== fd.get('confirm')) throw aerr('x', 'The new passwords don’t match.'); const had = await Auth.adapter.changePassword({ current: fd.get('current'), next: fd.get('next') }); toast({ title: had ? 'Password updated' : 'Password added', body: had ? 'Other devices stay signed in until you sign them out below.' : 'You can now log in with your email and password.' }); refresh(); });
  if (kind === 'twofaSetup') return go('Verifying…', async () => { await Auth.adapter.confirm2FA(fd.get('code')); toast({ title: 'Two-factor authentication is on' }); refresh(); });
  if (kind === 'emailChange') return go('Sending…', async () => { const r = await Auth.adapter.requestEmailChange(fd.get('email')); UI.emailChange = { email: fd.get('email'), code: r.demoCode }; openEmailChange(2); });
  if (kind === 'emailConfirm') return go('Verifying…', async () => { await Auth.adapter.confirmEmailChange(fd.get('code')); closeModal(); toast({ title: 'Email verified', body: esc(Auth.user.email) }); refresh(); });
});
function openEmailChange(step = 1) {
  const u = Auth.user;
  if (step === 1) return openModal(`${modalHead(u.email ? (u.emailVerified ? 'Change email' : 'Verify email') : 'Add email')}<div class="modal-body"><form class="stack" style="gap:14px" data-form="emailChange" novalidate><label class="field"><span>${u.email && u.emailVerified ? 'New email' : 'Email'}</span><input class="input" name="email" type="email" value="${u.email && !u.emailVerified ? esc(u.email) : ''}" autocomplete="email" autofocus></label><p class="mut" style="font-size:12.5px">We’ll send a 6-digit code to confirm you own this address.</p><div data-err></div><button class="btn btn-primary block" type="submit">Send code</button></form></div>`);
  setModal(`${modalHead('Enter the code')}<div class="modal-body"><p class="dim">Sent to <b style="color:var(--text)">${esc(UI.emailChange.email)}</b></p><div class="inbox"><div class="inbox-h"><span class="tag demo">simulated inbox</span></div><b>Confirm your email for Nexis</b><div class="otp-show num">${UI.emailChange.code}</div></div><form class="stack" style="gap:14px" data-form="emailConfirm" novalidate><input class="input otp num" name="code" inputmode="numeric" maxlength="6" placeholder="000000" autofocus><div data-err></div><button class="btn btn-primary block" type="submit">Verify</button></form></div>`);
}
function confirmAct(title, body, label, fn, danger = true) {
  openModal(`${modalHead(title)}<div class="modal-body"><p class="dim">${body}</p><div data-err></div></div><div class="modal-foot"><button class="btn btn-ghost" data-action="closeModal">Cancel</button><button class="btn ${danger ? 'btn-no on' : 'btn-primary'}" id="confirm-act">${label}</button></div>`);
  $('#confirm-act').onclick = async (e) => { const b = e.currentTarget; setBusy(b, true); try { await fn(); } catch (err) { setBusy(b, false); const box = $('.overlay [data-err]'); if (box) box.innerHTML = authErrorHtml(err.message); } };
}
async function logout() {
  await Auth.adapter.signOut(); closeModal(true); $('#user-pop') && ($('#user-pop').innerHTML = '');
  Store.init(null); Live.attach(); UI.setTab = 'account';
  location.hash = '#/'; toast({ title: 'You’re logged out', body: 'See you soon.', kind: 'info' });
}
function toggleUserMenu() {
