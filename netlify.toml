# Netlify: static site at the repo root + the /api functions via one adapter.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["api/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Referral links: /join?ref=<member number> opens the app, which keeps the code for sign-up.
[[redirects]]
  from = "/join"
  to = "/index.html"
  status = 200
